name: CI

on:
  push:
    branches:
      - main

jobs:
  mobile:
    name: kasat_mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasat_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pin to the last green CI SDK. Floating `stable` jumped to 3.50.0,
          # which marks package:flutter/material.dart deprecated (info-level
          # deprecated_member_use) and fails `flutter analyze` on every UI file.
          # material_ui is not available on 3.47.x, which this app targets.
          flutter-version: "3.47.9"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  dashboard:
    name: kasat_dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasat_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kasat_dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
